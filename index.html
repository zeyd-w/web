<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CSS Practice Playground</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/csslint/1.0.5/csslint.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1e1e2e;--bg2:#181825;--bg3:#11111b;--bg4:#313244;
  --border:#313244;--text:#cdd6f4;--muted:#6c7086;
  --blue:#89b4fa;--purple:#cba6f7;--green:#a6e3a1;
  --peach:#fab387;--red:#f38ba8;--yellow:#f9e2af;
  --r:6px;--th:48px;--tabh:36px;
}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}

/* toolbar */
#toolbar{height:var(--th);min-height:var(--th);background:var(--bg3);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;padding:0 12px;flex-shrink:0}
.logo{font-size:.95rem;font-weight:800;color:var(--blue);white-space:nowrap}
.logo span{color:var(--purple)}
.sep{width:1px;height:20px;background:var(--border);flex-shrink:0}
#csel{flex:1 1 160px;max-width:260px;min-width:100px;background:var(--bg4);color:var(--text);
  border:1px solid var(--border);border-radius:var(--r);padding:4px 8px;font-size:.82rem;cursor:pointer;outline:none}
#csel:focus{border-color:var(--blue)}
.btn{height:28px;padding:0 12px;border:none;border-radius:var(--r);font-size:.8rem;font-weight:600;
  cursor:pointer;white-space:nowrap;flex-shrink:0;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.95)}.btn:hover{opacity:.82}
.brun{background:var(--green);color:#1e1e2e}
.breset{background:var(--bg4);color:var(--text);border:1px solid var(--border)}
.bhint{background:var(--peach);color:#1e1e2e}
.bchal{background:var(--bg4);color:var(--text);border:1px solid var(--border)}
.bchal.on{border-color:var(--purple);color:var(--purple)}
#errBadge{display:none;background:var(--red);color:#1e1e2e;font-size:.7rem;font-weight:700;
  padding:2px 7px;border-radius:99px;white-space:nowrap;flex-shrink:0}
#errBadge.on{display:block}

/* work area */
#work{flex:1 1 0;display:flex;flex-direction:column;overflow:hidden;min-height:0}
#split{flex:1 1 0;display:flex;overflow:hidden;min-height:0}

/* editor pane */
#edPane{width:50%;min-width:200px;display:flex;flex-direction:column;background:var(--bg2);
  border-right:1px solid var(--border);overflow:hidden}
.tabbar{display:flex;background:var(--bg3);border-bottom:1px solid var(--border);height:var(--tabh);flex-shrink:0}
.tab{height:var(--tabh);padding:0 16px;background:none;border:none;color:var(--muted);font-size:.8rem;
  font-weight:600;cursor:pointer;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
.tab:hover{color:var(--text)}.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.ewrap{display:none;flex:1 1 0;flex-direction:column;overflow:hidden;min-height:0}
.ewrap.on{display:flex}
.CodeMirror{flex:1 1 0;height:100%!important;font-size:13.5px;line-height:1.65;
  font-family:'Cascadia Code','Fira Code','JetBrains Mono',Consolas,monospace}
.CodeMirror-scroll{height:100%}

/* resizers */
#hres{width:5px;min-width:5px;cursor:col-resize;background:var(--border);z-index:10;transition:background .2s}
#hres:hover,#hres.d{background:var(--blue)}
#vres{height:5px;min-height:5px;cursor:row-resize;background:var(--border);z-index:10;
  transition:background .2s;display:none;flex-shrink:0}
#vres.show{display:block}
#vres:hover,#vres.d{background:var(--purple)}

/* preview pane */
#prevPane{flex:1 1 0;min-width:200px;display:flex;flex-direction:column;background:var(--bg2);overflow:hidden}
.panehdr{height:var(--tabh);background:var(--bg3);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 12px;gap:7px;font-size:.75rem;color:var(--muted);
  font-weight:600;text-transform:uppercase;letter-spacing:.4px;flex-shrink:0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
#prevFrame{flex:1 1 0;border:none;background:#fff;min-height:0}

/* challenge panel */
#chalPanel{height:220px;min-height:80px;background:var(--bg2);border-top:1px solid var(--border);
  display:none;flex-direction:column;overflow:hidden;flex-shrink:0}
#chalPanel.on{display:flex}
.chalHdr{height:34px;background:var(--bg3);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0}
.chalHdr h3{font-size:.78rem;color:var(--purple);text-transform:uppercase;letter-spacing:.4px;flex:1}
.chalBody{flex:1 1 0;display:flex;overflow:hidden;min-height:0}
.chalDesc{flex:1 1 0;padding:12px 16px;overflow-y:auto;font-size:.83rem;line-height:1.65;scrollbar-width:thin}
.chalDesc h4{color:var(--blue);margin-bottom:5px;font-size:.87rem}
.chalDesc ul{padding-left:16px}
.chalDesc li{margin-bottom:3px}
.chalDesc code{background:var(--bg4);padding:1px 5px;border-radius:3px;font-family:monospace;font-size:.8rem;color:var(--peach)}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.7rem;font-weight:700;margin-bottom:7px}
.easy{background:#a6e3a115;color:var(--green);border:1px solid var(--green)}
.med{background:#f9e2af15;color:var(--yellow);border:1px solid var(--yellow)}
.hard{background:#f38ba815;color:var(--red);border:1px solid var(--red)}
.hints{width:270px;flex-shrink:0;border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.hintshdr{padding:8px 12px 5px;font-size:.72rem;text-transform:uppercase;color:var(--muted);letter-spacing:.4px;flex-shrink:0}
#hintList{flex:1 1 0;overflow-y:auto;padding:0 8px 8px;scrollbar-width:thin}
.hi{background:var(--bg4);border-radius:var(--r);margin-bottom:5px;overflow:hidden}
.histep{padding:6px 10px;font-size:.77rem;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:7px;user-select:none}
.histep:hover{color:var(--text)}
.hinum{width:17px;height:17px;background:var(--bg3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:700;flex-shrink:0;color:var(--blue)}
.hicode{display:none;padding:7px 10px;background:var(--bg3);font-family:monospace;font-size:.76rem;color:var(--peach);white-space:pre-wrap;word-break:break-all}
.hi.open .hicode{display:block}
.hiapply{display:none;margin:3px 10px 7px;padding:3px 9px;font-size:.7rem;border-radius:var(--r);background:var(--purple);color:#1e1e2e;border:none;cursor:pointer;font-weight:600}
.hi.open .hiapply{display:inline-block}
.hiapply:hover{opacity:.8}

/* error popup */
#errPanel{position:fixed;bottom:10px;right:10px;max-width:340px;background:var(--bg3);
  border:1px solid var(--red);border-radius:var(--r);z-index:800;display:none;box-shadow:0 4px 24px #0009;overflow:hidden}
#errPanel.on{display:block}
.errhdr{background:#f38ba810;padding:5px 10px;display:flex;align-items:center;justify-content:space-between;
  font-size:.73rem;color:var(--red);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.errhdr button{background:none;border:none;color:var(--red);cursor:pointer;font-size:1rem}
#errList{max-height:140px;overflow-y:auto;padding:6px 10px;scrollbar-width:thin}
.ei{font-size:.77rem;color:var(--text);padding:3px 0;border-bottom:1px solid var(--border);line-height:1.5}
.ei:last-child{border:none}
.etag{font-size:.66rem;font-weight:700;padding:1px 4px;border-radius:3px;margin-right:4px}
.eterr{background:#f38ba820;color:var(--red)}.etwarn{background:#f9e2af20;color:var(--yellow)}

/* autocomplete popup */
#acPop{display:none;position:fixed;z-index:9000;background:#1e1e2e;border:1px solid #45475a;
  border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.7);overflow:hidden;min-width:170px;max-width:310px}
#acInner{max-height:200px;overflow-y:auto;padding:3px;scrollbar-width:thin;scrollbar-color:#45475a transparent}
.aci{padding:4px 9px;border-radius:5px;font-size:12.5px;
  font-family:'Cascadia Code','Fira Code',Consolas,monospace;
  color:#cdd6f4;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:6px}
.aci:hover,.aci.sel{background:#313244;color:#89b4fa}
.actype{font-size:.62rem;padding:1px 4px;border-radius:3px;flex-shrink:0;font-style:normal;font-weight:700;letter-spacing:.2px}
.t-prop{background:#89b4fa18;color:#89b4fa}.t-val{background:#a6e3a118;color:#a6e3a1}
.t-fn{background:#cba6f718;color:#cba6f7}.t-tag{background:#f38ba818;color:#f38ba8}
.t-attr{background:#fab38718;color:#fab387}.t-pseudo{background:#f9e2af18;color:#f9e2af}
#acFoot{padding:3px 9px 4px;font-size:.65rem;color:#45475a;border-top:1px solid #313244;display:flex;gap:10px}

/* scrollbars */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}

/* mobile */
@media(max-width:680px){
  #toolbar{height:auto;padding:7px 10px;flex-wrap:wrap;gap:6px}
  .sep{display:none}
  #csel{flex:1 1 130px;max-width:100%;font-size:.79rem}
  .btn{height:26px;padding:0 10px;font-size:.76rem}
  #split{flex-direction:column}
  #hres{display:none}
  #edPane{width:100%!important;flex:none;height:50vh;min-height:160px;border-right:none;border-bottom:1px solid var(--border)}
  #prevPane{flex:1 1 0;min-height:120px}
  #chalPanel{height:auto;max-height:260px}
  .hints{width:100%;border-left:none;border-top:1px solid var(--border)}
  .chalBody{flex-direction:column}
  #errPanel{max-width:calc(100vw - 20px)}
}
</style>
</head>
<body>
<div id="app">

<div id="toolbar">
  <div class="logo">CSS<span>Forge</span></div>
  <div class="sep"></div>
  <select id="csel">
    <option value="blank">── Free Play ──</option>
    <optgroup label="Beginner">
      <option value="center-div">① Center a Div</option>
      <option value="color-box">② Color Box Basics</option>
      <option value="typography">③ Typography Styles</option>
    </optgroup>
    <optgroup label="Intermediate">
      <option value="flexbox-nav">④ Flexbox Nav Bar</option>
      <option value="card-hover">⑤ Card with Hover</option>
      <option value="grid-layout">⑥ CSS Grid Layout</option>
    </optgroup>
    <optgroup label="Advanced">
      <option value="anim-btn">⑦ Animated Button</option>
      <option value="glass">⑧ Glassmorphism Card</option>
      <option value="resp-nav">⑨ Responsive Nav</option>
    </optgroup>
  </select>
  <button class="btn brun"   id="runBtn">&#9654; Run</button>
  <button class="btn breset" id="resetBtn">&#8634; Reset</button>
  <button class="btn bhint"  id="hintBtn">&#128161; Hints</button>
  <button class="btn bchal"  id="chalBtn">&#128203; Challenge</button>
  <span id="errBadge">&#9888; CSS errors</span>
</div>

<div id="work">
  <div id="split">
    <div id="edPane">
      <div class="tabbar">
        <button class="tab on" data-tab="html">HTML</button>
        <button class="tab"    data-tab="css">CSS</button>
      </div>
      <div class="ewrap on" id="w-html"><textarea id="htmlEd"></textarea></div>
      <div class="ewrap"    id="w-css"><textarea id="cssEd"></textarea></div>
    </div>
    <div id="hres"></div>
    <div id="prevPane">
      <div class="panehdr"><div class="dot" id="dot"></div>Live Preview</div>
      <iframe id="prevFrame" sandbox="allow-scripts allow-same-origin" title="Live Preview"></iframe>
    </div>
  </div>
  <div id="vres"></div>
  <div id="chalPanel">
    <div class="chalHdr">
      <h3 id="chalTitle">Challenge</h3>
      <button class="btn breset" id="loadBtn" style="height:22px;padding:0 9px;font-size:.7rem">Load Starter</button>
    </div>
    <div class="chalBody">
      <div class="chalDesc" id="chalDesc">Pick a challenge from the dropdown.</div>
      <div class="hints">
        <div class="hintshdr">Hints</div>
        <div id="hintList"></div>
      </div>
    </div>
  </div>
</div>

<div id="acPop">
  <div id="acInner"></div>
  <div id="acFoot"><span>&#8593;&#8595; navigate</span><span>Enter/Tab apply</span><span>Esc close</span></div>
</div>

<div id="errPanel">
  <div class="errhdr">CSS Issues <button id="errClose">&#215;</button></div>
  <div id="errList"></div>
</div>

<script>
'use strict';

/* ── Challenges ─────────────────────────────────────────────────────── */
var CH = {
  blank:{title:'Free Play',diff:null,
    desc:'<p>Write any HTML and CSS. Preview updates automatically.</p>',
    html:'<div class="box">Hello, CSS!</div>',
    css:'.box {\n  padding: 40px;\n  text-align: center;\n  font-size: 2rem;\n  font-family: sans-serif;\n}',
    hints:[]},

  'center-div':{title:'Center a Div',diff:'easy',
    desc:'<span class="badge easy">Easy</span><h4>Goal</h4><p>Horizontally and vertically center <code>.box</code> inside <code>.container</code>.</p><ul><li>Container fills viewport</li><li>Use <strong>Flexbox</strong></li></ul>',
    html:'<div class="container">\n  <div class="box">Centered!</div>\n</div>',
    css:'.container {\n  /* fill screen + center with flexbox */\n}\n\n.box {\n  width: 200px;\n  height: 100px;\n  background: #89b4fa;\n  color: #1e1e2e;\n  font-size: 1.4rem;\n  font-family: sans-serif;\n  font-weight: bold;\n  border-radius: 8px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}',
    hints:[
      {l:'Set container size',c:'.container {\n  width: 100vw;\n  height: 100vh;\n}'},
      {l:'Add display: flex',c:'.container {\n  display: flex;\n}'},
      {l:'Center horizontally',c:'.container {\n  justify-content: center;\n}'},
      {l:'Center vertically',c:'.container {\n  align-items: center;\n}'},
    ]},

  'color-box':{title:'Color Box Basics',diff:'easy',
    desc:'<span class="badge easy">Easy</span><h4>Goal</h4><p>Three boxes, equal size, different colors, rounded corners in a row.</p><ul><li>Each: <code>150x150px</code></li><li>Different <code>background-color</code></li><li><code>border-radius: 12px</code></li></ul>',
    html:'<div class="row">\n  <div class="box box-1">One</div>\n  <div class="box box-2">Two</div>\n  <div class="box box-3">Three</div>\n</div>',
    css:'.row {\n  display: flex;\n  gap: 20px;\n  padding: 40px;\n  font-family: sans-serif;\n}\n.box {\n  /* size, radius, centered text */\n}\n.box-1 { /* color 1 */ }\n.box-2 { /* color 2 */ }\n.box-3 { /* color 3 */ }',
    hints:[
      {l:'Set box size',c:'.box {\n  width: 150px;\n  height: 150px;\n}'},
      {l:'Border radius',c:'.box {\n  border-radius: 12px;\n}'},
      {l:'Center text',c:'.box {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  font-weight: bold;\n  font-size: 1.1rem;\n}'},
      {l:'Colors',c:'.box-1 { background: #f38ba8; }\n.box-2 { background: #a6e3a1; }\n.box-3 { background: #89b4fa; }'},
    ]},

  typography:{title:'Typography Styles',diff:'easy',
    desc:'<span class="badge easy">Easy</span><h4>Goal</h4><p>Style text elements into a polished article look.</p><ul><li><code>h1</code>: large, tight letter-spacing</li><li><code>p</code>: line-height ~1.7</li><li><code>a</code>: custom color, underline on hover only</li><li><code>blockquote</code>: left border, italic</li></ul>',
    html:"<article>\n  <h1>The Art of CSS</h1>\n  <p>CSS is a <a href=\"#\">powerful</a> styling language.\n  Mastering it opens a world of creative possibilities.</p>\n  <blockquote>\"Design is intelligence made visible.\"</blockquote>\n  <p>Learn it step by step.</p>\n</article>",
    css:'body { background: #f8f8f8; }\narticle {\n  max-width: 600px;\n  margin: 60px auto;\n  padding: 0 20px;\n  font-family: Georgia, serif;\n}\nh1 { /* style me */ }\np  { /* style me */ }\na  { /* style me */ }\nblockquote { /* style me */ }',
    hints:[
      {l:'h1 style',c:'h1 {\n  font-size: 2.4rem;\n  color: #1a1a2e;\n  letter-spacing: -1px;\n  margin-bottom: 16px;\n}'},
      {l:'Paragraph style',c:'p {\n  color: #444;\n  line-height: 1.75;\n  margin-bottom: 1rem;\n}'},
      {l:'Link style',c:'a {\n  color: #6c63ff;\n  text-decoration: none;\n}\na:hover {\n  text-decoration: underline;\n}'},
      {l:'Blockquote',c:'blockquote {\n  border-left: 4px solid #6c63ff;\n  padding: 8px 20px;\n  margin: 20px 0;\n  font-style: italic;\n  color: #666;\n  background: #f0eeff;\n}'},
    ]},

  'flexbox-nav':{title:'Flexbox Nav Bar',diff:'medium',
    desc:'<span class="badge med">Medium</span><h4>Goal</h4><p>Build a nav bar with logo left and links right using <strong>Flexbox</strong>.</p><ul><li>Dark background, full width</li><li>Links highlight on hover</li></ul>',
    html:'<nav>\n  <a class="logo" href="#">MyBrand</a>\n  <ul class="links">\n    <li><a href="#">Home</a></li>\n    <li><a href="#">About</a></li>\n    <li><a href="#">Work</a></li>\n    <li><a href="#">Contact</a></li>\n  </ul>\n</nav>\n<main>\n  <h2>Page Content</h2>\n  <p>Nav sits above.</p>\n</main>',
    css:'* { box-sizing: border-box; margin: 0; padding: 0; }\nnav {\n  /* flex, space-between, dark bg */\n}\n.logo { /* large, bold, colored */ }\n.links { /* flex row, no bullets */ }\n.links a { /* padding, hover transition */ }\n.links a:hover { }\nmain { padding: 40px; font-family: sans-serif; }',
    hints:[
      {l:'Nav base',c:'nav {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  background: #1a1a2e;\n  padding: 0 24px;\n  height: 60px;\n}'},
      {l:'Logo',c:'.logo {\n  font-size: 1.3rem;\n  font-weight: 800;\n  color: #89b4fa;\n  text-decoration: none;\n}'},
      {l:'Links',c:'.links {\n  display: flex;\n  list-style: none;\n  gap: 4px;\n}\n.links a {\n  color: #cdd6f4;\n  text-decoration: none;\n  padding: 8px 14px;\n  border-radius: 6px;\n  font-family: sans-serif;\n  font-size: .9rem;\n  transition: background .2s, color .2s;\n}'},
      {l:'Hover',c:'.links a:hover {\n  background: #313244;\n  color: #89b4fa;\n}'},
    ]},

  'card-hover':{title:'Card with Hover',diff:'medium',
    desc:'<span class="badge med">Medium</span><h4>Goal</h4><p>Card that lifts and deepens shadow on hover.</p><ul><li>Rounded white card with image area</li><li>Hover: <code>translateY</code> + deeper shadow</li><li>Smooth <code>transition</code></li></ul>',
    html:'<div class="cards">\n  <div class="card">\n    <div class="img"></div>\n    <div class="body">\n      <h3>Product Name</h3>\n      <p>A short description here.</p>\n      <button>Buy Now</button>\n    </div>\n  </div>\n  <div class="card">\n    <div class="img" style="background:#cba6f7"></div>\n    <div class="body">\n      <h3>Another One</h3>\n      <p>Even more awesome.</p>\n      <button>Buy Now</button>\n    </div>\n  </div>\n</div>',
    css:'body { background: #f0f0f5; font-family: sans-serif; padding: 40px; }\n.cards { display: flex; gap: 24px; flex-wrap: wrap; }\n.card {\n  /* width, white bg, radius, shadow, transition */\n}\n.card:hover {\n  /* lift + deeper shadow */\n}\n.img { height: 160px; background: #89b4fa; }\n.body { padding: 16px; }\n.body h3 { }\n.body p { }\n.body button { }',
    hints:[
      {l:'Base card',c:'.card {\n  width: 240px;\n  background: #fff;\n  border-radius: 14px;\n  overflow: hidden;\n  box-shadow: 0 2px 12px rgba(0,0,0,.08);\n  transition: transform .25s, box-shadow .25s;\n}'},
      {l:'Hover lift',c:'.card:hover {\n  transform: translateY(-6px);\n  box-shadow: 0 12px 32px rgba(0,0,0,.15);\n}'},
      {l:'Body text',c:'.body h3 {\n  margin-bottom: 8px;\n}\n.body p {\n  font-size: .85rem;\n  color: #666;\n  margin-bottom: 14px;\n  line-height: 1.5;\n}'},

/* ── AC Engine ───────────────────────────────────────────────────────── */
var acPop   = document.getElementById('acPop');
var acInner = document.getElementById('acInner');
var acSt    = null;
var acTimer = null;

function acClose() {
  acPop.style.display = 'none';
  acSt = null;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function acRender() {
  if (!acSt) return;
  acInner.innerHTML = '';
  var limit = Math.min(acSt.items.length, 12);
  for (var i = 0; i < limit; i++) {
    (function(idx) {
      var item = acSt.items[idx];
      var el = document.createElement('div');
      el.className = 'aci' + (idx === acSt.sel ? ' sel' : '');
      el.innerHTML = '<em class="actype t-' + item.k + '">' + item.k + '</em>' + esc(item.t);
      el.addEventListener('mousedown', function(e) { e.preventDefault(); acApply(idx); });
      el.addEventListener('mouseover',  function()  { acSt.sel = idx; acRender(); });
      acInner.appendChild(el);
    })(i);
  }
  var sel = acInner.querySelector('.sel');
  if (sel) sel.scrollIntoView({block:'nearest'});
}

function acApply(idx) {
  if (!acSt) return;
  var i = (idx !== undefined) ? idx : acSt.sel;
  if (i < 0 || i >= acSt.items.length) { acClose(); return; }
  var text = acSt.items[i].t;
  var cm   = acSt.cm;
  var from = acSt.from;
  var to   = acSt.to;
  acClose();
  cm.replaceRange(text, from, to);
  if (text.slice(-2) === '()') {
    var c = cm.getCursor();
    cm.setCursor({line: c.line, ch: c.ch - 1});
  }
  cm.focus();
}

function acMove(d) {
  if (!acSt) return;
  var max = Math.min(acSt.items.length, 12);
  acSt.sel = (acSt.sel + d + max) % max;
  acRender();
}

function acShow(cm, items, from, to) {
  if (!items.length) { acClose(); return; }
  acSt = {cm: cm, items: items, from: from, to: to, sel: 0};
  acRender();
  var coords = cm.charCoords(from, 'page');
  acPop.style.display = 'block';
  var pw = acPop.offsetWidth, ph = acPop.offsetHeight;
  var ww = window.innerWidth,  wh = window.innerHeight;
  var left = Math.min(coords.left, ww - pw - 6);
  var top  = coords.bottom + 2;
  if (top + ph > wh - 6) top = coords.top - ph - 2;
  acPop.style.left = left + 'px';
  acPop.style.top  = top  + 'px';
}

/* keyboard nav — capture phase fires before CodeMirror */
document.addEventListener('keydown', function(e) {
  if (!acSt) return;
  var k = e.key;
  if (k === 'ArrowDown' || k === 'ArrowUp' || k === 'Enter' || k === 'Tab' || k === 'Escape') {
    e.preventDefault();
    e.stopPropagation();
    if      (k === 'ArrowDown') acMove(1);
    else if (k === 'ArrowUp')   acMove(-1);
    else if (k === 'Escape')    acClose();
    else                        acApply();
  }
}, true);

document.addEventListener('mousedown', function(e) {
  if (acSt && !acPop.contains(e.target)) acClose();
});

/* ── CSS completions ──────────────────────────────────────────────────────── */
function cssComplete(cm) {
  var cur  = cm.getCursor();
  var line = cm.getLine(cur.line);
  var pre  = line.slice(0, cur.ch);

  // at-rule
  var atM = pre.match(/@([\w-]*)$/);
  if (atM) {
    var p = '@' + atM[1];
    var from = {line: cur.line, ch: cur.ch - p.length};
    var items = AC_AT.filter(function(a){return a.indexOf(p)===0;}).map(function(a){return {t:a,k:'prop'};});
    return items.length ? {items:items,from:from,to:cur} : null;
  }

  // pseudo
  var psM = pre.match(/:{1,2}([\w-]*)$/);
  if (psM && /[a-zA-Z\]#.*)]/.test(pre[pre.length - psM[0].length - 1] || '')) {
    var colon = pre.slice(pre.length - psM[0].length, pre.length - psM[1].length);
    var typed = psM[1];
    var full  = colon + typed;
    var from  = {line: cur.line, ch: cur.ch - full.length};
    var items = AC_PSEUDOS.filter(function(p){return p.indexOf(colon+typed)===0;}).map(function(p){return {t:p,k:'pseudo'};});
    return items.length ? {items:items,from:from,to:cur} : null;
  }

  // value (after property: )
  var valM = pre.match(/^\s*([\w-]+)\s*:\s*([\w%-]*)$/);
  if (valM) {
    var prop   = valM[1].toLowerCase();
    var prefix = valM[2];
    var from   = {line: cur.line, ch: cur.ch - prefix.length};
    var pool   = AC_VALUES[prop] || AC_VALUES[prop.replace(/^-(webkit|moz|ms)-/,'')] || [];
    var gen    = ['inherit','initial','unset','revert','auto','none'];
    var all    = pool.concat(gen.filter(function(g){return pool.indexOf(g)===-1;}));
    var items  = all.filter(function(v){return v.indexOf(prefix)===0;}).map(function(v){return {t:v,k:'val'};}
      ).concat(AC_FUNCS.filter(function(f){return f.indexOf(prefix)===0;}).map(function(f){return {t:f,k:'fn'};}));
    return items.length ? {items:items,from:from,to:cur} : null;
  }

  // skip if we're inside a value expression
  if (/:\s*\S/.test(pre)) return null;

  // property name
  var propM = pre.match(/(?:^|\{|;)\s*([\w-]+)$/);
  if (propM && propM[1]) {
    var prefix = propM[1];
    var from   = {line: cur.line, ch: cur.ch - prefix.length};
    var items  = AC_PROPS.filter(function(p){return p.indexOf(prefix)===0;}).map(function(p){return {t:p+': ',k:'prop'};});
    return items.length ? {items:items,from:from,to:cur} : null;
  }

  return null;
}

    var items  = AC_INPUT_TYPES.filter(function(t){return t.indexOf(prefix)===0;}).map(function(t){return {t:t,k:'val'};});
    return items.length ? {items:items,from:from,to:cur} : null;
  }

  // attribute inside a tag
  var tagCtx = pre.match(/<([\w-]+)(?:\s+[^>]*)?\s([\w-]*)$/);
  if (tagCtx) {
    var tagName = tagCtx[1].toLowerCase();
    var prefix  = tagCtx[2];
    var from    = {line: cur.line, ch: cur.ch - prefix.length};
    var specific = AC_ATTRS[tagName] || [];
    var all      = specific.concat(AC_ATTRS._g.filter(function(a){return specific.indexOf(a)===-1;}));
    var items    = all.filter(function(a){return a.indexOf(prefix)===0;}).map(function(a){return {t:a,k:'attr'};});
    return items.length ? {items:items,from:from,to:cur} : null;
  }

  // tag name
  var tagM = pre.match(/<\/?([a-zA-Z][\w-]*)$/);
  if (tagM) {
    var prefix = tagM[1];
    var from   = {line: cur.line, ch: cur.ch - prefix.length};
    var items  = AC_TAGS.filter(function(t){return t.indexOf(prefix.toLowerCase())===0;}).map(function(t){return {t:t,k:'tag'};});
    return items.length ? {items:items,from:from,to:cur} : null;
  }

  return null;
}

function triggerAC(cm, force) {
  clearTimeout(acTimer);
  acTimer = setTimeout(function() {
    try {
      var mode = cm.getModeAt(cm.getCursor()).name;
      var res  = (mode === 'css') ? cssComplete(cm) : htmlComplete(cm);
      if (res) acShow(cm, res.items, res.from, res.to);
      else if (!force) acClose();
    } catch(e) { /* ignore */ }
  }, force ? 0 : 220);
}

/* ── CodeMirror editors ─────────────────────────────────────────────────────── */
var KEYS = {
  'Ctrl-/':     'toggleComment',
  'Cmd-/':      'toggleComment',
  'Ctrl-Space': function(cm) { triggerAC(cm, true); },
};

var htmlEd = CodeMirror.fromTextArea(document.getElementById('htmlEd'), {
  mode:'htmlmixed', theme:'dracula', lineNumbers:true,
  autoCloseBrackets:true, matchBrackets:true, styleActiveLine:true,
  lineWrapping:true, tabSize:2, indentWithTabs:false, extraKeys:KEYS,
});

var cssEd = CodeMirror.fromTextArea(document.getElementById('cssEd'), {
  mode:'css', theme:'dracula', lineNumbers:true,
  autoCloseBrackets:true, matchBrackets:true, styleActiveLine:true,
  lineWrapping:true, tabSize:2, indentWithTabs:false, extraKeys:KEYS,
});

htmlEd.on('change', function(cm, ch) {
  if (ch.origin === '+delete' || ch.origin === 'undo' || ch.origin === 'redo') { acClose(); return; }
  triggerAC(cm);
});
cssEd.on('change', function(cm, ch) {
  if (ch.origin === '+delete' || ch.origin === 'undo' || ch.origin === 'redo') { acClose(); return; }
  triggerAC(cm);
});

function refresh() { htmlEd.refresh(); cssEd.refresh(); }
setTimeout(refresh, 50); setTimeout(refresh, 200); setTimeout(refresh, 600);
window.addEventListener('resize', refresh);
window.addEventListener('orientationchange', function(){ setTimeout(refresh, 300); });

/* ── Preview ───────────────────────────────────────────────────────────── */
var frame  = document.getElementById('prevFrame');
var dot    = document.getElementById('dot');
var runTmr = null;

function buildDoc(html, css) {
  return '<!DOCTYPE html><html><head><meta charset="UTF-8">'
    + '<meta name="viewport" content="width=device-width,initial-scale=1">'
    + '<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}\n'
    + css + '\n</style></head><body>' + html + '</body></html>';
}

function runPreview() {
  var html = htmlEd.getValue();
  var css  = cssEd.getValue();
  dot.style.background = 'var(--yellow)';
  try {
    var blob = new Blob([buildDoc(html, css)], {type:'text/html'});
    var url  = URL.createObjectURL(blob);
    var old  = frame.src;
    frame.src = url;
    if (old && old.slice(0,5) === 'blob:') URL.revokeObjectURL(old);
    dot.style.background = 'var(--green)';
  } catch(e) {
    dot.style.background = 'var(--red)';
  }
  lintCSS(css);
}

function scheduleRun() {
  clearTimeout(runTmr);
  runTmr = setTimeout(runPreview, 650);
}
htmlEd.on('change', scheduleRun);
cssEd.on( 'change', scheduleRun);

/* ── CSS Lint ──────────────────────────────────────────────────────────── */
var errBadge = document.getElementById('errBadge');
var errPanel = document.getElementById('errPanel');
var errList  = document.getElementById('errList');

function lintCSS(css) {
  if (!css.trim() || typeof CSSLint === 'undefined') { clearErr(); return; }
  try {
    var res  = CSSLint.verify(css, {'known-properties':true,'duplicate-properties':true});
    var msgs = res.messages.filter(function(m){ return m.type === 'error' || m.type === 'warning'; });
    if (msgs.length) {
      errBadge.textContent = '⚠ ' + msgs.length + ' issue' + (msgs.length > 1 ? 's' : '');
      errBadge.classList.add('on');
      errList.innerHTML = msgs.slice(0,8).map(function(m){
        return '<div class="ei"><span class="etag ' + (m.type==='error'?'eterr':'etwarn') + '">'
          + m.type.toUpperCase() + '</span>Line ' + m.line + ': ' + m.message + '</div>';
      }).join('');
      errPanel.classList.add('on');
    } else { clearErr(); }
  } catch(e) { clearErr(); }
}
function clearErr() { errBadge.classList.remove('on'); errPanel.classList.remove('on'); }
document.getElementById('errClose').addEventListener('click', function(){ errPanel.classList.remove('on'); });

/* ── Tabs ────────────────────────────────────────────────────────────── */
document.querySelectorAll('.tab').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.tab').forEach(function(b){ b.classList.remove('on'); });
    document.querySelectorAll('.ewrap').forEach(function(w){ w.classList.remove('on'); });
    btn.classList.add('on');
    document.getElementById('w-' + btn.dataset.tab).classList.add('on');
    setTimeout(refresh, 10);
  });
});

/* ── Challenges ────────────────────────────────────────────────────────── */
var chalPanel = document.getElementById('chalPanel');
var chalTitle = document.getElementById('chalTitle');
var chalDesc  = document.getElementById('chalDesc');
var hintList  = document.getElementById('hintList');
var chalSel   = document.getElementById('csel');

function escH(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function loadChallenge(key, inject) {
  var ch = CH[key];
  if (!ch) return;
  chalTitle.textContent = ch.title;
  chalDesc.innerHTML    = ch.desc;
  hintList.innerHTML    = '';
  ch.hints.forEach(function(h, i) {
    var item = document.createElement('div');
    item.className = 'hi';
    item.innerHTML = '<div class="histep"><span class="hinum">' + (i+1) + '</span>' + escH(h.l) + '</div>'
      + '<pre class="hicode">' + escH(h.c) + '</pre>'
      + '<button class="hiapply">Apply ↗</button>';
    item.querySelector('.histep').addEventListener('click', function(){ item.classList.toggle('open'); });
    item.querySelector('.hiapply').addEventListener('click', function(){
      cssEd.setValue(cssEd.getValue() + '\n' + h.c);
      document.querySelector('[data-tab="css"]').click();
    });
    hintList.appendChild(item);
  });
  if (inject) {
    htmlEd.setValue(ch.html);
    cssEd.setValue(ch.css);
    runPreview();
  }
}

chalSel.addEventListener('change', function(){ loadChallenge(chalSel.value, false); });
document.getElementById('loadBtn').addEventListener('click', function(){ loadChallenge(chalSel.value, true); });
document.getElementById('runBtn').addEventListener('click', runPreview);
document.getElementById('resetBtn').addEventListener('click', function(){ loadChallenge(chalSel.value, true); });

document.getElementById('chalBtn').addEventListener('click', function() {
  var btn = document.getElementById('chalBtn');
  var on  = chalPanel.classList.toggle('on');
  document.getElementById('vres').classList.toggle('show', on);
  btn.classList.toggle('on', on);
  if (on) loadChallenge(chalSel.value, false);
  setTimeout(refresh, 300);
});

document.getElementById('hintBtn').addEventListener('click', function() {
  chalPanel.classList.add('on');
  document.getElementById('vres').classList.add('show');
  document.getElementById('chalBtn').classList.add('on');
  loadChallenge(chalSel.value, false);
  setTimeout(function(){ hintList.scrollIntoView({behavior:'smooth',block:'nearest'}); refresh(); }, 100);
});

/* ── Resizers ──────────────────────────────────────────────────────────── */
(function() {  // horizontal
  var rz = document.getElementById('hres');
  var ed = document.getElementById('edPane');
  var row= document.getElementById('split');
  var drag=false, sx=0, sw=0;
  rz.addEventListener('mousedown',function(e){drag=true;sx=e.clientX;sw=ed.getBoundingClientRect().width;rz.classList.add('d');document.body.style.cursor='col-resize';document.body.style.userSelect='none';});
  document.addEventListener('mousemove',function(e){if(!drag)return;var w=Math.min(Math.max(sw+e.clientX-sx,180),row.getBoundingClientRect().width-180);ed.style.width=w+'px';ed.style.flex='none';});
  document.addEventListener('mouseup',function(){if(!drag)return;drag=false;rz.classList.remove('d');document.body.style.cursor='';document.body.style.userSelect='';refresh();});
})();

(function() {  // vertical
  var rz = document.getElementById('vres');
  var cp = document.getElementById('chalPanel');
  var drag=false, sy=0, sh=0;
  rz.addEventListener('mousedown',function(e){if(!chalPanel.classList.contains('on'))return;drag=true;sy=e.clientY;sh=cp.getBoundingClientRect().height;rz.classList.add('d');document.body.style.cursor='row-resize';document.body.style.userSelect='none';});
  document.addEventListener('mousemove',function(e){if(!drag)return;var h=Math.min(Math.max(sh+sy-e.clientY,80),500);cp.style.height=h+'px';});
  document.addEventListener('mouseup',function(){if(!drag)return;drag=false;rz.classList.remove('d');document.body.style.cursor='';document.body.style.userSelect='';refresh();});
})();

/* ── Init ────────────────────────────────────────────────────────────── */
loadChallenge('blank', true);
</script>
