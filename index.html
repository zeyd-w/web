<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Practice Playground</title>

  <!-- CodeMirror 5 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/lint.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/lint.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
  <!-- No external hint addons — autocomplete is fully custom (see JS) -->
  <!-- CSS Lint for error checking -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/csslint/1.0.5/csslint.min.js"></script>

  <style>
    /* ─── Reset & Base ────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-app:        #1e1e2e;
      --bg-panel:      #181825;
      --bg-tab:        #313244;
      --bg-tab-active: #1e1e2e;
      --bg-toolbar:    #11111b;
      --bg-challenge:  #181825;
      --accent:        #89b4fa;
      --accent2:       #cba6f7;
      --accent3:       #a6e3a1;
      --accent4:       #fab387;
      --text:          #cdd6f4;
      --text-muted:    #6c7086;
      --border:        #313244;
      --error:         #f38ba8;
      --warn:          #f9e2af;
      --radius:        6px;
      --toolbar-h:     48px;
      --challenge-h:   220px;
      --tab-h:         36px;
      --resizer-w:     5px;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-app);
      color: var(--text);
      overflow: hidden;
    }

    /* ─── App Shell ───────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ─── Toolbar ─────────────────────────────────────────── */
    #toolbar {
      height: var(--toolbar-h);
      min-height: var(--toolbar-h);
      background: var(--bg-toolbar);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      flex-wrap: nowrap;
      overflow: hidden;
    }

    #toolbar .logo {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: .5px;
      white-space: nowrap;
      margin-right: 6px;
    }
    #toolbar .logo span { color: var(--accent2); }

    .toolbar-sep {
      width: 1px;
      height: 22px;
      background: var(--border);
      flex-shrink: 0;
    }

    #challengeSelect {
      flex: 1 1 180px;
      min-width: 120px;
      max-width: 280px;
      background: var(--bg-tab);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px 8px;
      font-size: .85rem;
      cursor: pointer;
      outline: none;
      transition: border-color .2s;
    }
    #challengeSelect:focus { border-color: var(--accent); }

    .btn {
      height: 30px;
      padding: 0 14px;
      border: none;
      border-radius: var(--radius);
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn:active { transform: scale(.96); }
    .btn:hover  { opacity: .85; }

    .btn-run    { background: var(--accent3); color: #1e1e2e; }
    .btn-reset  { background: var(--bg-tab);  color: var(--text); border: 1px solid var(--border); }
    .btn-hint   { background: var(--accent4); color: #1e1e2e; }
    .btn-toggle { background: var(--bg-tab);  color: var(--text); border: 1px solid var(--border); }
    .btn-toggle.active { border-color: var(--accent2); color: var(--accent2); }

    #errorBadge {
      display: none;
      background: var(--error);
      color: #1e1e2e;
      font-size: .72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 99px;
      white-space: nowrap;
      cursor: default;
      flex-shrink: 0;
    }
    #errorBadge.visible { display: block; }

    /* ─── Main Work Area ──────────────────────────────────── */
    #workspace {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top split: editor | preview */
    #splitRow {
      flex: 1 1 0;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* ─── Editor Pane ─────────────────────────────────────── */
    #editorPane {
      width: 50%;
      min-width: 220px;
      display: flex;
      flex-direction: column;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    .tab-bar {
      display: flex;
      background: var(--bg-toolbar);
      border-bottom: 1px solid var(--border);
      height: var(--tab-h);
    }
    .tab-btn {
      height: var(--tab-h);
      padding: 0 16px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color .2s, border-color .2s;
      white-space: nowrap;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    .editor-wrap {
      display: none;
      flex: 1 1 0;
      flex-direction: column;
      overflow: hidden;
    }
    .editor-wrap.active { display: flex; }

    .CodeMirror {
      flex: 1 1 0;
      height: 100% !important;
      font-size: 13.5px;
      line-height: 1.6;
      font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
    }

    /* ─── Drag Resizer ────────────────────────────────────── */
    #resizer {
      width: var(--resizer-w);
      min-width: var(--resizer-w);
      cursor: col-resize;
      background: var(--border);
      transition: background .2s;
      z-index: 10;
    }
    #resizer:hover, #resizer.dragging { background: var(--accent); }

    /* ─── Preview Pane ────────────────────────────────────── */
    #previewPane {
      flex: 1 1 0;
      min-width: 220px;
      display: flex;
      flex-direction: column;
      background: var(--bg-panel);
      overflow: hidden;
    }

    .pane-header {
      height: var(--tab-h);
      background: var(--bg-toolbar);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 14px;
      font-size: .78rem;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: .4px;
      text-transform: uppercase;
      gap: 8px;
    }
    .pane-header .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent3);
    }

    #previewFrame {
      flex: 1 1 0;
      border: none;
      background: #fff;
    }

    /* ─── Challenge Panel ─────────────────────────────────── */
    #challengePanel {
      height: var(--challenge-h);
      min-height: 120px;
      background: var(--bg-challenge);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: height .25s ease;
    }
    #challengePanel.hidden {
      height: 0 !important;
      min-height: 0;
      border-top: none;
    }

    #vResizer {
      height: 5px;
      cursor: row-resize;
      background: var(--border);
      transition: background .2s;
      z-index: 10;
    }
    #vResizer:hover, #vResizer.dragging { background: var(--accent2); }

    .challenge-header {
      height: 36px;
      background: var(--bg-toolbar);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      flex-shrink: 0;
    }
    .challenge-header h3 {
      font-size: .82rem;
      color: var(--accent2);
      letter-spacing: .4px;
      text-transform: uppercase;
      flex: 1;
    }

    .challenge-body {
      flex: 1 1 0;
      display: flex;
      overflow: hidden;
      gap: 0;
    }

    .challenge-desc {
      flex: 1 1 0;
      padding: 14px 18px;
      overflow-y: auto;
      font-size: .85rem;
      line-height: 1.65;
      color: var(--text);
      scrollbar-width: thin;
    }
    .challenge-desc h4 {
      color: var(--accent);
      margin-bottom: 6px;
      font-size: .9rem;
    }
    .challenge-desc ul {
      padding-left: 18px;
    }
    .challenge-desc li { margin-bottom: 4px; }
    .challenge-desc code {
      background: var(--bg-tab);
      padding: 1px 5px;
      border-radius: 3px;
      font-family: monospace;
      font-size: .82rem;
      color: var(--accent4);
    }
    .challenge-desc .badge {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 99px;
      font-size: .72rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .badge-easy   { background: #a6e3a120; color: var(--accent3); border: 1px solid var(--accent3); }
    .badge-medium { background: #f9e2af20; color: var(--warn); border: 1px solid var(--warn); }
    .badge-hard   { background: #f38ba820; color: var(--error); border: 1px solid var(--error); }

    .challenge-hints {
      width: 280px;
      flex-shrink: 0;
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .hints-header {
      padding: 10px 14px 6px;
      font-size: .75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: .4px;
      flex-shrink: 0;
    }
    #hintList {
      flex: 1 1 0;
      overflow-y: auto;
      padding: 0 10px 10px;
      scrollbar-width: thin;
    }
    .hint-item {
      background: var(--bg-tab);
      border-radius: var(--radius);
      margin-bottom: 6px;
      overflow: hidden;
    }
    .hint-step {
      padding: 7px 11px;
      font-size: .78rem;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      user-select: none;
    }
    .hint-step:hover { color: var(--text); }
    .hint-step .step-num {
      width: 18px; height: 18px;
      background: var(--bg-toolbar);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .68rem;
      font-weight: 700;
      flex-shrink: 0;
      color: var(--accent);
    }
    .hint-code {
      display: none;
      padding: 8px 11px;
      background: var(--bg-toolbar);
      font-family: monospace;
      font-size: .78rem;
      color: var(--accent4);
      white-space: pre-wrap;
      word-break: break-all;
    }
    .hint-item.open .hint-code { display: block; }
    .hint-apply-btn {
      display: none;
      margin: 4px 11px 8px;
      padding: 3px 10px;
      font-size: .72rem;
      border-radius: var(--radius);
      background: var(--accent2);
      color: #1e1e2e;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    .hint-item.open .hint-apply-btn { display: inline-block; }
    .hint-apply-btn:hover { opacity: .8; }

    /* ─── Error Panel ─────────────────────────────────────── */
    #errorPanel {
      position: fixed;
      bottom: 10px;
      right: 12px;
      max-width: 360px;
      background: var(--bg-toolbar);
      border: 1px solid var(--error);
      border-radius: var(--radius);
      overflow: hidden;
      z-index: 1000;
      display: none;
      box-shadow: 0 4px 24px #0008;
    }
    #errorPanel.visible { display: block; }
    #errorPanel .ep-header {
      background: #f38ba815;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: .75rem;
      color: var(--error);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .4px;
    }
    #errorPanel .ep-close {
      background: none;
      border: none;
      color: var(--error);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
    }
    #errorList {
      max-height: 160px;
      overflow-y: auto;
      padding: 8px 12px;
      scrollbar-width: thin;
    }
    .error-item {
      font-size: .78rem;
      color: var(--text);
      padding: 4px 0;
      border-bottom: 1px solid var(--border);
      line-height: 1.5;
    }
    .error-item:last-child { border-bottom: none; }
    .error-item .err-type {
      font-size: .68rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      margin-right: 5px;
    }
    .err-error { background: #f38ba820; color: var(--error); }
    .err-warning { background: #f9e2af20; color: var(--warn); }

    /* ─── Custom Autocomplete Popup ─────────────────────── */
    #ac-popup {
      display: none;
      position: fixed;
      z-index: 9999;
      background: #1e1e2e;
      border: 1px solid #45475a;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,.65);
      overflow: hidden;
      min-width: 180px;
      max-width: 320px;
    }
    #ac-list {
      max-height: 210px;
      overflow-y: auto;
      padding: 4px;
      scrollbar-width: thin;
      scrollbar-color: #45475a transparent;
    }
    .ac-item {
      padding: 5px 10px;
      border-radius: 5px;
      font-family: 'Cascadia Code','Fira Code','JetBrains Mono',Consolas,monospace;
      font-size: 12.5px;
      color: #cdd6f4;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .ac-item:hover, .ac-item.ac-active {
      background: #313244;
      color: #89b4fa;
    }
    .ac-type {
      font-size: .65rem;
      padding: 1px 5px;
      border-radius: 3px;
      flex-shrink: 0;
      font-style: normal;
      font-weight: 700;
      letter-spacing: .3px;
    }
    .ac-type-prop  { background: #89b4fa22; color: #89b4fa; }
    .ac-type-value { background: #a6e3a122; color: #a6e3a1; }
    .ac-type-tag   { background: #f38ba822; color: #f38ba8; }
    .ac-type-attr  { background: #fab38722; color: #fab387; }
    .ac-type-fn    { background: #cba6f722; color: #cba6f7; }
    .ac-type-pseudo{ background: #f9e2af22; color: #f9e2af; }
    #ac-footer {
      padding: 4px 10px 5px;
      font-size: .68rem;
      color: #585b70;
      border-top: 1px solid #313244;
      display: flex;
      gap: 10px;
    }

    /* ─── Scrollbars ──────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bg-tab); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* ─── Mobile Layout ───────────────────────────────────── */
    @media (max-width: 700px) {
      :root { --toolbar-h: auto; }

      /* Toolbar: two tidy rows */
      #toolbar {
        flex-wrap: wrap;
        height: auto;
        padding: 8px 10px;
        gap: 6px;
        align-items: center;
      }
      .logo { font-size: .9rem; }
      .toolbar-sep { display: none; }

      /* Challenge select fills its row */
      #challengeSelect {
        flex: 1 1 140px;
        max-width: 100%;
        font-size: .8rem;
      }

      /* Compact buttons */
      .btn { height: 28px; padding: 0 11px; font-size: .78rem; }
      #errorBadge { font-size: .68rem; padding: 2px 6px; }

      /* Stack editor above preview */
      #splitRow { flex-direction: column; }
      #resizer  { display: none; }

      /* Editor takes up a good chunk of screen — tall enough to type */
      #editorPane {
        width: 100% !important;
        flex: none;
        height: 52vh;
        min-height: 200px;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      /* CodeMirror fills the editor pane */
      .editor-wrap.active { height: 100%; }
      .CodeMirror { font-size: 13px !important; }

      /* Preview takes remaining space */
      #previewPane { flex: 1 1 0; min-height: 160px; }

      /* Challenge panel */
      #challengePanel  { height: auto; max-height: 280px; }
      .challenge-hints { width: 100%; border-left: none; border-top: 1px solid var(--border); }
      .challenge-body  { flex-direction: column; }

      #errorPanel { max-width: calc(100vw - 20px); right: 10px; bottom: 8px; }
    }

    /* Very small phones */
    @media (max-width: 400px) {
      #editorPane { height: 48vh; }
      .btn { height: 26px; padding: 0 9px; font-size: .74rem; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- ── Toolbar ── -->
  <div id="toolbar">
    <div class="logo">CSS<span>Forge</span></div>

    <div class="toolbar-sep"></div>

    <select id="challengeSelect">
      <option value="blank">── Free Play ──</option>
      <optgroup label="Beginner">
        <option value="center-div">① Center a Div</option>
        <option value="color-box">② Color Box Basics</option>
        <option value="typography">③ Typography Styles</option>
      </optgroup>
      <optgroup label="Intermediate">
        <option value="flexbox-nav">④ Flexbox Nav Bar</option>
        <option value="card-hover">⑤ Card with Hover Effect</option>
        <option value="grid-layout">⑥ CSS Grid Layout</option>
      </optgroup>
      <optgroup label="Advanced">
        <option value="animated-button">⑦ Animated Button</option>
        <option value="glassmorphism">⑧ Glassmorphism Card</option>
        <option value="responsive-nav">⑨ Responsive Nav</option>
      </optgroup>
    </select>

    <button class="btn btn-run"    id="runBtn">▶ Run</button>
    <button class="btn btn-reset"  id="resetBtn">↺ Reset</button>
    <button class="btn btn-hint"   id="hintBtn">💡 Hints</button>
    <button class="btn btn-toggle" id="challengeToggleBtn">📋 Challenge</button>
    <span   id="errorBadge">⚠ CSS errors</span>
  </div>

  <!-- ── Workspace ── -->
  <div id="workspace">

    <!-- Vertical resizer for challenge panel -->
    <div id="vResizer"></div>

    <!-- Main split row -->
    <div id="splitRow">

      <!-- Editor pane -->
      <div id="editorPane">
        <div class="tab-bar">
          <button class="tab-btn active" data-tab="html">HTML</button>
          <button class="tab-btn"        data-tab="css">CSS</button>
        </div>

        <div class="editor-wrap active" id="wrap-html">
          <textarea id="htmlEditor"></textarea>
        </div>
        <div class="editor-wrap" id="wrap-css">
          <textarea id="cssEditor"></textarea>
        </div>
      </div>

      <!-- Drag resizer -->
      <div id="resizer"></div>

      <!-- Preview pane -->
      <div id="previewPane">
        <div class="pane-header">
          <div class="status-dot" id="statusDot"></div>
          Live Preview
        </div>
        <iframe id="previewFrame"
          sandbox="allow-scripts allow-same-origin"
          title="Live Preview"></iframe>
      </div>

    </div>

    <!-- Challenge panel (above splitRow visually but rendered below for DOM order) -->
    <div id="challengePanel" class="hidden">
      <div class="challenge-header">
        <h3 id="challengeTitle">Challenge</h3>
        <button class="btn btn-toggle" id="loadChallengeBtn" style="font-size:.72rem;height:24px;padding:0 10px;">Load Starter Code</button>
      </div>
      <div class="challenge-body">
        <div class="challenge-desc" id="challengeDesc">Select a challenge from the dropdown above.</div>
        <div class="challenge-hints">
          <div class="hints-header">Hints</div>
          <div id="hintList"></div>
        </div>
      </div>
    </div>

  </div>

</div>

<!-- Custom Autocomplete Popup -->
<div id="ac-popup">
  <div id="ac-list"></div>
  <div id="ac-footer"><span>↑↓ navigate</span><span>↵ / Tab apply</span><span>Esc close</span></div>
</div>

<!-- Error Panel -->
<div id="errorPanel">
  <div class="ep-header">
    CSS Issues
    <button class="ep-close" id="closeErrors">×</button>
  </div>
  <div id="errorList"></div>
</div>

<script>
// ─── Challenge Data ──────────────────────────────────────────────────────────
const CHALLENGES = {
  blank: {
    title: 'Free Play',
    difficulty: null,
    description: '<p>Write any HTML and CSS you like. Use the editors on the left and click <strong>Run</strong> to see the result.</p>',
    html: `<div class="box">Hello, CSS!</div>`,
    css: `.box {\n  padding: 40px;\n  text-align: center;\n  font-size: 2rem;\n  font-family: sans-serif;\n}`,
    hints: []
  },

  'center-div': {
    title: 'Center a Div',
    difficulty: 'easy',
    description: `
      <span class="badge badge-easy">Easy</span>
      <h4>🎯 Goal</h4>
      <p>Horizontally <em>and</em> vertically center the <code>.box</code> inside the <code>.container</code>.</p>

// ─── Custom Autocomplete Engine ───────────────────────────────────────────────
const acPopup = document.getElementById('ac-popup');
const acList  = document.getElementById('ac-list');
let acState = null; // { cm, items, from, to, sel }

function acClose() {
  acPopup.style.display = 'none';
  acState = null;
}

function acRender() {
  if (!acState) return;
  const { items, sel } = acState;
  acList.innerHTML = '';
  const limit = Math.min(items.length, 12);
  for (let i = 0; i < limit; i++) {
    const { text, type } = items[i];
    const el = document.createElement('div');
    el.className = 'ac-item' + (i === sel ? ' ac-active' : '');
    el.innerHTML = `<em class="ac-type ac-type-${type}">${type}</em>${escapeAC(text)}`;
    el.addEventListener('mousedown', e => { e.preventDefault(); acApply(i); });
    el.addEventListener('mouseover',  () => { acState.sel = i; acRender(); });
    acList.appendChild(el);
  }
  // Scroll selected into view
  const active = acList.querySelector('.ac-active');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

function escapeAC(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function acApply(idx) {
  if (!acState) return;
  const { cm, items, from, to } = acState;
  const idx2 = idx !== undefined ? idx : acState.sel;
  if (idx2 < 0 || idx2 >= items.length) { acClose(); return; }
  const text = items[idx2].text;
  cm.replaceRange(text, from, to);
  // For function completions, place cursor between the parens
  if (text.endsWith('()')) {
    const cur = cm.getCursor();
    cm.setCursor({ line: cur.line, ch: cur.ch - 1 });
  }
  acClose();
  cm.focus();
}

function acMove(dir) {
  if (!acState) return;
  const max = Math.min(acState.items.length, 12);
  acState.sel = (acState.sel + dir + max) % max;
  acRender();
}

function acShow(cm, items, from, to) {
  if (!items.length) { acClose(); return; }
  acState = { cm, items, from, to, sel: 0 };
  acRender();
  // Position near cursor
  const coords = cm.charCoords(from, 'page');
  const ww = window.innerWidth, wh = window.innerHeight;
  acPopup.style.display = 'block';
  const pw = acPopup.offsetWidth, ph = acPopup.offsetHeight;
  let left = coords.left;
  let top  = coords.bottom + 2;
  if (left + pw > ww - 8) left = ww - pw - 8;
  if (top + ph  > wh - 8) top  = coords.top - ph - 2;
  acPopup.style.left = left + 'px';
  acPopup.style.top  = top  + 'px';
}

// ─── Context-aware completion logic ──────────────────────────────────────────

function getCSSCompletions(cm) {
  const cursor = cm.getCursor();
  const line   = cm.getLine(cursor.line);
  const before = line.slice(0, cursor.ch);

  // Inside a CSS comment — skip
  if (/\/\*/.test(before) && !/\*\//.test(before.split('/*').pop())) return null;

  // After a ':' → value context
  const valueMatch = before.match(/^\s*([\w-]+)\s*:\s*([\w%-]*(?:\s[\w%-]*)?)$/);
  if (valueMatch) {
    const prop   = valueMatch[1].toLowerCase();
    const vRaw   = valueMatch[2];
    const parts  = vRaw.split(/\s+/);
    const prefix = parts[parts.length - 1];
    const from   = { line: cursor.line, ch: cursor.ch - prefix.length };
    const pool   = AC.cssValues[prop] || AC.cssValues[prop.replace(/^-(webkit|moz|ms)-/, '')] || [];
    // Merge with general keywords
    const all    = [...new Set([...pool, 'inherit','initial','unset','revert','auto'])];
    const fns    = AC.cssFunctions;
    const items  = [
      ...all.filter(v => v.startsWith(prefix)).map(v => ({ text: v, type: 'value' })),
      ...fns.filter(f => f.startsWith(prefix)).map(f => ({ text: f, type: 'fn' })),
    ];
    return items.length ? { items, from, to: cursor } : null;
  }

  // After '(' inside a value (function args) — offer colors and keywords
  if (/:\s*[\w-]+\([^)]*$/.test(before)) return null;

  // At-rule
  const atMatch = before.match(/@([\w-]*)$/);
  if (atMatch) {
    const prefix = '@' + atMatch[1];
    const items  = AC.cssAtRules
      .filter(a => a.startsWith(prefix))
      .map(a => ({ text: a, type: 'prop' }));
    return items.length ? { items, from: { line: cursor.line, ch: cursor.ch - prefix.length }, to: cursor } : null;
  }

  // Pseudo-class / pseudo-element
  const pseudoMatch = before.match(/:{1,2}([\w-]*)$/);
  if (pseudoMatch) {
    const pfx    = before.endsWith('::') ? '::' : before.endsWith(':') ? ':' : ':';
    const typed  = pseudoMatch[1];
    const full   = pfx + typed;
    const from   = { line: cursor.line, ch: cursor.ch - full.length };
    const items  = AC.cssPseudos
      .filter(p => p.startsWith(pfx + typed))
      .map(p => ({ text: p, type: 'pseudo' }));
    return items.length ? { items, from, to: cursor } : null;
  }

  // CSS property name (general token)
  const propMatch = before.match(/(?:^|\{|\s)([\w-]*)$/);
  if (propMatch) {
    const prefix = propMatch[1];
    if (!prefix) return null;
    const from   = { line: cursor.line, ch: cursor.ch - prefix.length };
    const items  = AC.cssProps
      .filter(p => p.startsWith(prefix))
      .map(p => ({ text: p + ': ', type: 'prop' }));
    return items.length ? { items, from, to: cursor } : null;
  }

  return null;
}

function getHTMLCompletions(cm) {
  const cursor = cm.getCursor();
  const line   = cm.getLine(cursor.line);
  const before = line.slice(0, cursor.ch);

  // Inside a string attribute value (e.g. type="|")
  const typeValMatch = before.match(/\btype=["']?([\w-]*)$/);
  if (typeValMatch) {
    const prefix = typeValMatch[1];
    const from   = { line: cursor.line, ch: cursor.ch - prefix.length };
    const items  = AC.htmlInputTypes
      .filter(t => t.startsWith(prefix))
      .map(t => ({ text: t, type: 'value' }));
    return items.length ? { items, from, to: cursor } : null;
  }

  // Opening tag: <tag or inside a tag for attributes
  // Detect current open tag context
  const tagCtx = before.match(/<([\w-]+)([^>]*)$/);
  if (tagCtx) {
    const tagName = tagCtx[1].toLowerCase();
    // Attribute name context (after whitespace inside a tag)
    const attrMatch = before.match(/\s([\w-]*)$/);
    if (attrMatch) {
      const prefix = attrMatch[1];
      const from   = { line: cursor.line, ch: cursor.ch - prefix.length };
      const specific = AC.htmlAttrs[tagName] || [];
      const global   = AC.htmlAttrs._global;
      const all      = [...new Set([...specific, ...global])];
      const items    = all
        .filter(a => a.startsWith(prefix))
        .map(a => ({ text: a, type: 'attr' }));
      return items.length ? { items, from, to: cursor } : null;
    }
  }

  // Tag name: < or </
  const tagMatch = before.match(/<\/?([a-zA-Z][\w-]*)$/);
  if (tagMatch) {
    const prefix  = tagMatch[1];
    const isClose = before.match(/<\//);
    const from    = { line: cursor.line, ch: cursor.ch - prefix.length };
    const items   = AC.htmlTags
      .filter(t => t.startsWith(prefix.toLowerCase()))
      .map(t => ({ text: t, type: 'tag' }));
    return items.length ? { items, from, to: cursor } : null;
  }

  // Just typed '<'
  if (before.endsWith('<') || before.endsWith('</')) {
    const from = { line: cursor.line, ch: cursor.ch };
    const items = AC.htmlTags.map(t => ({ text: t, type: 'tag' }));
    return { items, from, to: cursor };
  }

  return null;
}

// ─── Keyboard navigation for popup (capture phase — fires before CodeMirror) ─
document.addEventListener('keydown', e => {
  if (!acState) return;
  if      (e.key === 'ArrowDown') { e.preventDefault(); e.stopPropagation(); acMove(1);    }
  else if (e.key === 'ArrowUp')   { e.preventDefault(); e.stopPropagation(); acMove(-1);   }
  else if (e.key === 'Enter')     { e.preventDefault(); e.stopPropagation(); acApply();    }
  else if (e.key === 'Tab')       { e.preventDefault(); e.stopPropagation(); acApply();    }
  else if (e.key === 'Escape')    { e.preventDefault(); e.stopPropagation(); acClose();    }
}, true); // true = capture phase

// Close popup on outside click
document.addEventListener('mousedown', e => {
  if (acState && !acPopup.contains(e.target)) acClose();
});

// ─── Auto-trigger on every keypress ──────────────────────────────────────────
let acDebounce = null;

function triggerAC(cm, force = false) {
  clearTimeout(acDebounce);
  acDebounce = setTimeout(() => {
    const mode = cm.getMode().name;
    let result = null;
    if (mode === 'css') result = getCSSCompletions(cm);
    else                result = getHTMLCompletions(cm);
    if (result) {
      acShow(cm, result.items, result.from, result.to);
    } else if (!force) {
      acClose();
    }
  }, force ? 0 : 200);
}

htmlEditor.on('change', (cm, ch) => {
  if (ch.origin === '+delete' || ch.origin === 'undo' || ch.origin === 'redo') { acClose(); return; }
  triggerAC(cm);
});
cssEditor.on('change', (cm, ch) => {
  if (ch.origin === '+delete' || ch.origin === 'undo' || ch.origin === 'redo') { acClose(); return; }
  triggerAC(cm);
});

// Re-evaluate suggestions when cursor moves (e.g. after applying a completion)
htmlEditor.on('cursorActivity', () => { if (acState) triggerAC(htmlEditor); });
cssEditor.on( 'cursorActivity', () => { if (acState) triggerAC(cssEditor); });

function refreshEditors() {
  htmlEditor.refresh();
  cssEditor.refresh();
}
setTimeout(refreshEditors, 50);
window.addEventListener('resize', refreshEditors);

// ─── Preview Engine ──────────────────────────────────────────────────────────
const frame = document.getElementById('previewFrame');
const statusDot = document.getElementById('statusDot');
let debounceTimer = null;

function buildDoc(html, css) {
  return `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;}
${css}
</style>
</head>
<body>
${html}
</body>
</html>`;
}

function runPreview() {
  const html = htmlEditor.getValue();
  const css  = cssEditor.getValue();
  const doc  = buildDoc(html, css);

  statusDot.style.background = 'var(--warn)';
  try {
    const blob = new Blob([doc], { type: 'text/html' });
    const url  = URL.createObjectURL(blob);
    const old  = frame.src;
    frame.src  = url;
    if (old && old.startsWith('blob:')) URL.revokeObjectURL(old);
    statusDot.style.background = 'var(--accent3)';
  } catch (e) {
    statusDot.style.background = 'var(--error)';
  }

  validateCSS(css);
}

function scheduleRun() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(runPreview, 600);
}

htmlEditor.on('change', scheduleRun);
cssEditor.on('change',  scheduleRun);

// ─── CSS Validation ──────────────────────────────────────────────────────────
const errorBadge  = document.getElementById('errorBadge');
const errorPanel  = document.getElementById('errorPanel');
const errorList   = document.getElementById('errorList');

function validateCSS(css) {
  if (!css.trim() || typeof CSSLint === 'undefined') { clearErrors(); return; }
  try {
    const result = CSSLint.verify(css, {
      'known-properties': true,
      'duplicate-properties': true,
      'empty-rules': false,
      'important': false,
    });
    const messages = result.messages.filter(m => m.type === 'error' || m.type === 'warning');
    if (messages.length > 0) {
      errorBadge.textContent = `⚠ ${messages.length} CSS issue${messages.length > 1 ? 's' : ''}`;
      errorBadge.classList.add('visible');
      errorList.innerHTML = messages.slice(0, 8).map(m => `
        <div class="error-item">
          <span class="err-type ${m.type === 'error' ? 'err-error' : 'err-warning'}">${m.type.toUpperCase()}</span>
          Line ${m.line}: ${m.message}
        </div>`).join('');
      errorPanel.classList.add('visible');
    } else {
      clearErrors();
    }
  } catch (_) { clearErrors(); }
}

function clearErrors() {
  errorBadge.classList.remove('visible');
  errorPanel.classList.remove('visible');
  errorList.innerHTML = '';
}

document.getElementById('closeErrors').addEventListener('click', () => {
  errorPanel.classList.remove('visible');
});

  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.editor-wrap').forEach(w => w.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('wrap-' + btn.dataset.tab).classList.add('active');
    setTimeout(() => { htmlEditor.refresh(); cssEditor.refresh(); }, 10);
  });
});

// ─── Challenge System ────────────────────────────────────────────────────────
const challengePanel  = document.getElementById('challengePanel');
const challengeTitle  = document.getElementById('challengeTitle');
const challengeDesc   = document.getElementById('challengeDesc');
const hintList        = document.getElementById('hintList');
const challengeSelect = document.getElementById('challengeSelect');

function loadChallenge(key, injectCode = false) {
  const ch = CHALLENGES[key];
  if (!ch) return;

  challengeTitle.textContent = ch.title;
  challengeDesc.innerHTML = ch.description;

  hintList.innerHTML = '';
  ch.hints.forEach((h, i) => {
    const item = document.createElement('div');
    item.className = 'hint-item';
    item.innerHTML = `
      <div class="hint-step">
        <span class="step-num">${i + 1}</span>
        ${h.label}
      </div>
      <pre class="hint-code">${escapeHTML(h.code)}</pre>
      <button class="hint-apply-btn" data-hint="${i}">Apply ↗</button>`;

    item.querySelector('.hint-step').addEventListener('click', () => {
      item.classList.toggle('open');
    });
    item.querySelector('.hint-apply-btn').addEventListener('click', () => {
      const current = cssEditor.getValue();
      cssEditor.setValue(current + '\n' + h.code);
      // switch to CSS tab
      document.querySelector('[data-tab="css"]').click();
    });
    hintList.appendChild(item);
  });

  if (injectCode) {
    htmlEditor.setValue(ch.html);
    cssEditor.setValue(ch.css);
    runPreview();
  }
}

function escapeHTML(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

challengeSelect.addEventListener('change', () => {
  loadChallenge(challengeSelect.value, false);
  if (!challengePanel.classList.contains('hidden')) {
    // already open, just update desc
  }
});

document.getElementById('loadChallengeBtn').addEventListener('click', () => {
  loadChallenge(challengeSelect.value, true);
});

// ─── Buttons ─────────────────────────────────────────────────────────────────
document.getElementById('runBtn').addEventListener('click', runPreview);

document.getElementById('resetBtn').addEventListener('click', () => {
  loadChallenge(challengeSelect.value, true);
});

document.getElementById('challengeToggleBtn').addEventListener('click', () => {
  const btn = document.getElementById('challengeToggleBtn');
  challengePanel.classList.toggle('hidden');
  btn.classList.toggle('active');
  if (!challengePanel.classList.contains('hidden')) {
    loadChallenge(challengeSelect.value, false);
  }
  setTimeout(refreshEditors, 300);
});

document.getElementById('hintBtn').addEventListener('click', () => {
  // Open challenge panel and scroll to hints
  challengePanel.classList.remove('hidden');
  document.getElementById('challengeToggleBtn').classList.add('active');
  loadChallenge(challengeSelect.value, false);
  setTimeout(() => {
    hintList.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    refreshEditors();
  }, 100);
});

// ─── Horizontal Pane Resizer ─────────────────────────────────────────────────
(function() {
  const resizer     = document.getElementById('resizer');
  const editorPane  = document.getElementById('editorPane');
  const splitRow    = document.getElementById('splitRow');
  let dragging = false, startX = 0, startW = 0;

  resizer.addEventListener('mousedown', e => {
    dragging = true;
    startX = e.clientX;
    startW = editorPane.getBoundingClientRect().width;
    resizer.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const delta = e.clientX - startX;
    const total = splitRow.getBoundingClientRect().width;
    const newW  = Math.min(Math.max(startW + delta, 200), total - 200);
    editorPane.style.width = newW + 'px';
    editorPane.style.flex  = 'none';
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    resizer.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    refreshEditors();
  });

  // Touch support
  resizer.addEventListener('touchstart', e => {
    dragging = true;
    startX = e.touches[0].clientX;
    startW = editorPane.getBoundingClientRect().width;
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!dragging) return;
    const delta = e.touches[0].clientX - startX;
    const total = splitRow.getBoundingClientRect().width;
    const newW  = Math.min(Math.max(startW + delta, 200), total - 200);
    editorPane.style.width = newW + 'px';
    editorPane.style.flex  = 'none';
  }, { passive: true });

  document.addEventListener('touchend', () => {
    dragging = false;
    refreshEditors();
  });
})();

// ─── Vertical (Challenge) Pane Resizer ───────────────────────────────────────
(function() {
  const vResizer  = document.getElementById('vResizer');
  const chPanel   = document.getElementById('challengePanel');
  const workspace = document.getElementById('workspace');
  let dragging = false, startY = 0, startH = 0;

  vResizer.addEventListener('mousedown', e => {
    if (chPanel.classList.contains('hidden')) return;
    dragging = true;
    startY = e.clientY;
    startH = chPanel.getBoundingClientRect().height;
    vResizer.classList.add('dragging');
    document.body.style.cursor = 'row-resize';
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const delta = startY - e.clientY;
    const newH  = Math.min(Math.max(startH + delta, 100), 500);
    chPanel.style.height = newH + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    vResizer.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    refreshEditors();
  });
})();

// ─── Init ────────────────────────────────────────────────────────────────────
loadChallenge('blank', true);

// Put vResizer BEFORE challengePanel in DOM order (it's between splitRow and challengePanel)
(function reorderDOM() {
  const ws = document.getElementById('workspace');
  const sr = document.getElementById('splitRow');
  const vr = document.getElementById('vResizer');
  const cp = document.getElementById('challengePanel');
  ws.appendChild(sr);
  ws.appendChild(vr);
  ws.appendChild(cp);
})();

// On mobile, CodeMirror needs a refresh after the browser finishes its layout pass
// (especially after font loading and flex sizing settle)
if (window.innerWidth <= 700) {
  [50, 200, 500].forEach(ms => setTimeout(refreshEditors, ms));
}
window.addEventListener('orientationchange', () => {
  setTimeout(refreshEditors, 300);
});
</script>
